name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (ubuntu, node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # verify-windows is DISABLED for now — Windows Actions runners bill higher
  # than ubuntu/linux runners. Re-enable when cross-platform transport
  # coverage is worth the cost (e.g. to catch Windows-only spawn/taskkill paths).
  # verify-windows:
  #   name: Verify (windows, node 22)
  #   runs-on: windows-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 22
  #         cache: npm
  #     - run: npm ci
  #     - run: npm run format:check
  #     - run: npm run typecheck
  #     - run: npm run lint
  #     - run: npm run build
  #     - run: npm test

  release:
    name: Release (CD)
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Read package version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Skip if version already tagged
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git tag --list "v$VERSION" | grep -q .; then
            echo "v$VERSION already released — skipping CD."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "v$VERSION not released yet."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect commits since the previous release
        id: changelog
        if: steps.tag.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PREV=$(git tag --sort=-version:refname | sed "/^v${VERSION}$/d" | head -n 1)
          if [ -n "$PREV" ]; then
            RANGE="$PREV..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "This release contains $(git rev-list --count "$RANGE") commits:"
            echo
            git log --format="- %h %s" "$RANGE"
          } > release-notes.md
          echo "previous=$PREV" >> "$GITHUB_OUTPUT"
          echo "range=$RANGE" >> "$GITHUB_OUTPUT"
          cat release-notes.md

      - name: Create and push version tag
        if: steps.tag.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Build and pack tarball
        if: steps.tag.outputs.skip == 'false'
        run: |
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP"

      - name: Publish GitHub release
        if: steps.tag.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "testmymcp v$VERSION" \
            --notes-file release-notes.md \
            "$RUNNER_TEMP"/testmymcp-"$VERSION".tgz
