name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Verify (ubuntu, node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # verify-windows is DISABLED for now — Windows Actions runners bill higher
  # than ubuntu/linux runners. Re-enable when cross-platform transport
  # coverage is worth the cost (e.g. to catch Windows-only spawn/taskkill paths).
